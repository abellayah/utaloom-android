name: Build Utaloom Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android APK (FOSS Debug)
        run: |
          ./gradlew :app:assembleFossDebug --console=plain --warning-mode summary -x lint -x lintFossDebug
        env:
          UTALOOM_APPLICATION_ID: com.cabrata.utaloom.android
          UTALOOM_APP_NAME: Utaloom Android
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Collect APK Files
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/foss/debug/ -type f -name "*.apk" -exec cp -v {} output_apk/Utaloom-Android-FOSS-Debug.apk \;
          echo "Collected APKs:"
          ls -lh output_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Utaloom-Android-FOSS-Debug-APK
          path: output_apk/Utaloom-Android-FOSS-Debug.apk
          retention-days: 14

      - name: Create or Update Pre-Release with APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.2.0-debug"
          APK_FILE="output_apk/Utaloom-Android-FOSS-Debug.apk"

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Updating existing release $TAG_NAME..."
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" "$APK_FILE" \
              --title "Utaloom Android FOSS Debug APK" \
              --notes "Build otomatis dari GitHub Actions untuk commit $GITHUB_SHA. Siap diinstal langsung di perangkat Android (API 26+)." \
              --prerelease
          fi
